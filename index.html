<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afinador Multiinstrumento Profesional</title>
  <meta name="description" content="Afinador de instrumentos musicales en tiempo real. Soporta guitarra, bajo, ukelele, mandolina, banjo y lap steel.">
  <meta name="theme-color" content="#0e0e10">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.svg">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <main class="tuner-main">
      
      <!-- Main Tuner Big Card Box Section -->
      <section class="tuner-visor-section">
        <div class="main-tuner-card status-idle" id="main-tuner-card">
          
          <!-- Left Directional Arrow (Pitch High -> Tune Down / Aflojar) -->
          <div class="arrow-indicator arrow-left" id="arrow-left" title="Aflojar / Bajar afinación">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
              <path d="M20 7.41L18.59 6l-6 6 6 6 1.41-1.41L15.42 12z"/>
            </svg>
            <span class="arrow-label">AFLOJAR</span>
          </div>

          <!-- Card Central Content -->
          <div class="tuner-card-content">
            <div class="tuner-string-label" id="tuner-string-label">MODO CROMÁTICO</div>
            <div class="tuner-main-note" id="tuner-main-note">--</div>
            <div class="tuner-latin-note" id="tuner-latin-note">Esperando sonido</div>
            
            <div class="tuner-sub-info">
              <span id="tuner-freq">-- Hz</span>
              <span class="tuner-divider">•</span>
              <span id="tuner-cents">--</span>
            </div>
          </div>

          <!-- Right Directional Arrow (Pitch Low -> Tune Up / Apretar) -->
          <div class="arrow-indicator arrow-right" id="arrow-right" title="Apretar / Subir afinación">
            <span class="arrow-label">APRETAR</span>
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
              <path d="M4 16.59L5.41 18l6-6-6-6L4 7.41 8.58 12z"/>
            </svg>
          </div>

        </div>
      </section>

      <!-- Tuning Reference / Strings Layout (Hidden in Chromatic mode) -->
      <section class="strings-section" id="strings-section" style="display: none;">
        <div class="tuning-title-bar">
          <h4 id="active-tuning-name">AFINACIÓN</h4>
          <p id="active-tuning-notes">Notas objetivo</p>
        </div>
        <div class="strings-container" id="strings-container">
          <!-- Dynamically populated string target cards -->
        </div>
      </section>

      <!-- Controls & Selectors (Bottom) -->
      <section class="controls-section">
        <div class="mic-controls">
          <button id="btn-mic-toggle" class="btn btn-primary">
            <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span id="btn-mic-text">ACTIVAR MICRÓFONO</span>
          </button>
        </div>

        <div class="selectors-grid">
          <!-- Instrument Selector -->
          <div class="selector-group">
            <label for="select-instrument">INSTRUMENTO</label>
            <div class="custom-select-wrapper">
              <select id="select-instrument">
                <!-- Dynamically populated -->
              </select>
            </div>
          </div>

          <!-- Tuning Families -->
          <div class="selector-group">
            <label for="select-standard">STANDARD</label>
            <div class="custom-select-wrapper">
              <select id="select-standard" class="tuning-family-select" data-family="standard">
                <option value="">--</option>
              </select>
            </div>
          </div>

          <div class="selector-group">
            <label for="select-drop">DROP</label>
            <div class="custom-select-wrapper">
              <select id="select-drop" class="tuning-family-select" data-family="drop">
                <option value="">--</option>
              </select>
            </div>
          </div>

          <div class="selector-group">
            <label for="select-open">OPEN</label>
            <div class="custom-select-wrapper">
              <select id="select-open" class="tuning-family-select" data-family="open">
                <option value="">--</option>
              </select>
            </div>
          </div>

          <div class="selector-group">
            <label for="select-alternativas">ALTERNATIVAS</label>
            <div class="custom-select-wrapper">
              <select id="select-alternativas" class="tuning-family-select" data-family="alternativas">
                <option value="">--</option>
              </select>
            </div>
          </div>

          <div class="selector-group">
            <label for="select-otras">OTRAS</label>
            <div class="custom-select-wrapper">
              <select id="select-otras" class="tuning-family-select" data-family="otras">
                <option value="">--</option>
              </select>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="data.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
